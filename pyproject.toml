[project]
name = "psdl2"
version = "0.1.0"
description = "Original multi-layer review ROI import and physical crop bundles"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy==2.5.3", "torch==2.14.1", "pillow==12.3.0"]

[project.scripts]
psdl2-validate = "psdl2.data:main"

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/psdl2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
